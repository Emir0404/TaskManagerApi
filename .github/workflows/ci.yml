name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/results.trx"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t taskmanager-api:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 -e Jwt__Key=ci-only-secret-key-with-at-least-32-characters taskmanager-api:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/tasks || true)
            if [ "$code" = "401" ]; then echo "API is up (401 without a token, as expected)"; exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
      - name: The API refuses to start without a signing key
        run: |
          if docker run --rm taskmanager-api:ci 2>&1 | grep -q "Jwt:Key"; then echo "refused, as expected"; else exit 1; fi
